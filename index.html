body {
  min-height: 100vh;
  background: #FDF6EC;
  font-family: 'Georgia', serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  text-align: center;
  padding: 48px 24px 16px;
}

.deco { font-size: 20px; color: #C7614A; margin: 6px 0; }

h1 {
  font-size: clamp(2rem, 6vw, 3rem);
  color: #3B2A1A;
  font-weight: normal;
  letter-spacing: 0.05em;
  margin: 8px 0;
}

.subtitle {
  font-size: 0.95rem;
  color: #8B6F5A;
  font-style: italic;
  margin: 4px 0 8px;
}

main {
  width: 100%;
  max-width: 480px;
  padding: 16px 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.card {
  background: rgba(255,255,255,0.75);
  border-radius: 20px;
  border: 1.5px solid #E8D5C0;
  padding: 28px 24px 24px;
  box-shadow: 0 4px 24px rgba(199,97,74,0.08);
}

.card-title {
  font-size: 1.05rem;
  color: #3B2A1A;
  font-weight: normal;
  letter-spacing: 0.04em;
  margin-bottom: 16px;
}

.result-box {
  min-height: 110px;
  background: #FFF8F0;
  border-radius: 14px;
  border: 1px dashed #D4B49A;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s;
}

.result-box.empty { opacity: 0.4; }

.empty-text {
  color: #B8977E;
  font-size: 0.9rem;
  font-style: italic;
}

.result-name {
  font-size: 1rem;
  color: #3B2A1A;
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.5;
}

.result-desc {
  font-size: 0.85rem;
  color: #8B6F5A;
  font-style: italic;
  margin-bottom: 8px;
}

.swatch-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.tip-box {
  background: rgba(199,97,74,0.07);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
}

.tip-label {
  font-size: 0.75rem;
  color: #C7614A;
  font-weight: bold;
  letter-spacing: 0.05em;
  display: block;
  margin-bottom: 4px;
}

.tip-text {
  font-size: 0.82rem;
  color: #5C3D2A;
  line-height: 1.6;
}

.btn {
  width: 100%;
  padding: 14px;
  background: #C7614A;
  color: #FFF8F0;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  cursor: pointer;
  letter-spacing: 0.05em;
  font-family: inherit;
  box-shadow: 0 4px 16px rgba(199,97,74,0.25);
  transition: background 0.2s, transform 0.1s;
}

.btn:active { transform: scale(0.98); }
.btn:disabled { background: #B8977E; cursor: not-allowed; }

footer {
  text-align: center;
  padding: 0 0 32px;
  color: #B8977E;
  font-size: 0.85rem;
  font-style: italic;
}

.result-inner { width: 100%; }

.sketch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  gap: 10px;
}

.sketch-wrap svg {
  width: 100%;
  max-width: 220px;
  height: auto;
  border-radius: 8px;
}

    btn.textContent = '🎲 뽑는 중...';
    box.classList.add('empty');
    box.innerHTML = '<span class="empty-text">🎲 뽑는 중...</span>';

    setTimeout(() => {
      const items = data[key].items;
      const item = items[Math.floor(Math.random() * items.length)];
      box.innerHTML = data[key].render(item);
      box.classList.remove('empty');
      btn.disabled = false;
      btn.textContent = '🔄 다시 뽑기';
    }, 700);
  }
</script>

</body>
</html>
